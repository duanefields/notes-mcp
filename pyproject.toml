[project]
name = "notes-mcp"
version = "0.1.0"
description = "Apple Notes Model Context Protocol (MCP) server"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["apple-notes", "notes", "mcp", "model-context-protocol", "macos"]
dependencies = [
    "fastmcp>=3.0.0,<4",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
]

[project.scripts]
notes-mcp = "notes_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notes_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.ruff.lint]
# Bugs, not style. Widening this would mean reformatting files unrelated to
# whatever is being changed. See dav-mcp's CLAUDE.md for the reasoning.
select = ["E9", "F", "B"]
